name: Auto Assign & Discord Notify
on:
  pull_request:
    types: [opened]

jobs:
  assign-and-notify:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Auto-assign PR
        uses: pozil/auto-assign-issue@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          assignees: 5EUS,AaronCII,agruzberg,bmike3,DragonKnight914
          numOfAssignee: 2

      - name: Notify Discord
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USERNAME: "GitHub Bot"
          DISCORD_AVATAR: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
        with:
          args: |
            :new: PR **#{{ EVENT_PAYLOAD.pull_request.number }}** opened by **{{ EVENT_PAYLOAD.pull_request.user.login }}**
            **Title:** {{ EVENT_PAYLOAD.pull_request.title }}
            **URL:** {{ EVENT_PAYLOAD.pull_request.html_url }}
